name: "Reproducing Test-Case Detector (experimental)"


env:
  ImageOS: ubuntu22

on:
  pull_request:
    paths:
    - '**_test.exs'

permissions:
  contents: read

jobs:
  test:
    runs-on:
      - runs-on
      - runner=2cpu-linux-x64
      - "run-id=${{ github.run_id }}"
    name: "Test for lib/ changes"
    strategy:
      matrix:
        otp: [24.2.2]
        elixir: [1.12]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: Setup mise
        uses: step-security/mise-action@2796166110dee826668caddd4bffedae5116e7cd # v4.2.0

      - run: git fetch origin master:master

      - name: Check changes to lib/
        id: check_changes
        run: echo "::set-output name=changes_to_lib::$(git diff --name-only master | grep "^lib")"

      - name: There are changes to lib/
        if: "contains(steps.check_changes.outputs.changes_to_lib, 'lib')"
        run: |
          mix deps.get
          sh test/test_if_tests_fail_after_resetting_lib.sh

      - name: There are no changes to lib/
        if: "!contains(steps.check_changes.outputs.changes_to_lib, 'lib')"
        run: echo "${{ toJSON(steps.check_changes.outputs.changes_to_lib) }}"
