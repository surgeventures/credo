name: "Reproducing Test-Case Detector (experimental)"


env:
  ImageOS: ubuntu22

on:
  pull_request:
    paths:
    - '**_test.exs'

permissions:
  contents: read

jobs:
  test:
    runs-on:
      - runs-on
      - runner=2cpu-linux-x64
      - "run-id=${{ github.run_id }}"
    name: "Test for lib/ changes"
    strategy:
      matrix:
        otp: [24.2.2]
        elixir: [1.12]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2

      - name: Setup mise
        uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4.2.4
        with:
          version: '2026.8.12'

      - run: mix local.hex --force --if-missing
      - run: mix local.rebar --force --if-missing

      - run: git fetch origin master:master

      - name: Check changes to lib/
        id: check_changes
        run: echo "::set-output name=changes_to_lib::$(git diff --name-only master | grep "^lib")"

      - name: There are changes to lib/
        if: "contains(steps.check_changes.outputs.changes_to_lib, 'lib')"
        run: |
          mix deps.get
          sh test/test_if_tests_fail_after_resetting_lib.sh

      - name: There are no changes to lib/
        if: "!contains(steps.check_changes.outputs.changes_to_lib, 'lib')"
        run: echo "${{ toJSON(steps.check_changes.outputs.changes_to_lib) }}"
